[project]
name = "zneus-2026"
version = "0.1.0"
description = "ZNEUS 2026 - Neural Networks labs @ FIIT STU"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "tqdm>=4.70.0",
    "wandb>=0.30.0",
    "kaggle>=2.2.4",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

# ---------------------------------------------------------------------------
# PyTorch build variants.
#
#   uv sync                            -> CPU build (also Apple Silicon / MPS)
#   uv sync --no-group cpu --group cu130 -> NVIDIA GPU, CUDA 13.0 (recent drivers)
#   uv sync --no-group cpu --group cu126 -> NVIDIA GPU, CUDA 12.6 (older drivers)
#
# See SETUP.md for details.
# ---------------------------------------------------------------------------
[dependency-groups]
cpu = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
cu126 = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
cu130 = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
dev = [
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]

[tool.uv]
default-groups = ["cpu"]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu126" },
        { group = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu130", group = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
